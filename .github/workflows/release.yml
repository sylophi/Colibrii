# Publishing a release attaches the SDK to it, built from the release's
# tag: the tarball an app installs (sdk/ts/README.md, "Installing").
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit digests, so a retagged action cannot change
      # what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm pack:sdk

      - name: Attach the SDK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/*.tgz
