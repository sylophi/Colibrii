packages:
  - harness
  - sdk/ts
  - service

# Delay installs of newly published versions by 7 days (in minutes), and
# refuse updates whose trust signals (provenance, signatures) weaken.
minimumReleaseAge: 10080
trustPolicy: no-downgrade

# Which dependencies may run install scripts. esbuild (wrangler's
# bundler) and workerd (the Worker runtime) check their platform binary
# in a postinstall, the binary itself arriving as an optional dependency.
allowBuilds:
  esbuild: true
  workerd: true

catalog:
  "@clerk/backend": ^3.16.0
  "@cloudflare/workers-types": ^5.20260801.0
  "@effect/sql-sqlite-do": 4.1.4
  "@effect/tsgo": 0.51.1
  "@noble/ciphers": ^2.4.0
  "@noble/curves": ^2.4.0
  "@noble/hashes": ^2.4.0
  "@types/node": ^24.13.5
  "@types/ws": ^8.18.2
  effect: 4.1.4
  esbuild: 0.28.2
  oxfmt: 0.75.0
  oxlint: 1.73.0
  playwright-core: ~1.65.0
  typescript: ~7.0.2
  vitest: 5.0.3
  wrangler: ^4.120.0
  ws: ^8.22.1
