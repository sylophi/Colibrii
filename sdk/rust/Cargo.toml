[package]
name = "colibrii"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "The device side of Colibrii, which connects a person's devices to each other for any app"
repository = "https://github.com/sylophi/Colibrii"

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables"] }

[dev-dependencies]
sha2 = "0.11.1"
