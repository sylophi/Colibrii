[package]
name = "colibrii"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "The device side of Colibrii, which connects a person's devices to each other for any app"
repository = "https://github.com/sylophi/Colibrii"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
flate2 = "1.1.11"
getrandom = "0.4.3"
if-addrs = "0.15.0"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
